apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ricky_capstoneproject_cohort1-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
            - containerPort: 9876

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 3004
      targetPort: 3004
      nodePort: 31958
    - name: admin
      port: 9876
      targetPort: 9876
      nodePort: 31184