apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ricky_capstoneproject_cohort1-order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URI
              value: "mongodb://root:root@mongodb:27017/order_microservice?authSource=admin"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"

            - name: CAKE_CATALOG_URL
              value: "http://cake-catalog:3000"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP